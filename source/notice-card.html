<dialog class="notice-dialog" id="noticeDialog" aria-labelledby="noticeTitle">
 <div class="notice-sheet-stack" aria-hidden="true"></div>
 <div class="notice-paper" aria-hidden="true"></div>
 <div class="notice-end-stamp" id="noticeNameStamp" aria-hidden="true" hidden></div>
 <img class="notice-ornament" src="__NOTICE_FRAME__" alt="" aria-hidden="true">
 <div class="notice-layout">
  <header class="notice-header">
   <button class="notice-theme" id="noticeTheme" type="button" aria-label="切换日夜模式">☾</button>
   <h2 id="noticeTitle">须知</h2>
   <button class="notice-return" id="noticeReturn" type="button">返回<span aria-hidden="true">↗</span></button>
  </header>
  <div class="notice-body" id="noticeBody"><div class="notice-page-content" id="noticePageContent" aria-live="polite"></div></div>
  <footer class="notice-footer">
   <button id="noticePrevious" type="button" aria-label="上一页">←<span>上一页</span></button>
   <span class="notice-page-number" id="noticePageNumber" aria-label="页码">1 / 3</span>
   <button id="noticeNext" type="button" aria-label="下一页"><span>下一页</span>→</button>
  </footer>
 </div>
</dialog>
